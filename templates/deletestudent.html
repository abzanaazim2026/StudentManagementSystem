<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1 align="center">🗑️ Delete Student</h1>

    <h3 align="center">Are you sure you want to delete this student?</h3>

    <table border="1" align="center" cellpadding="10">
        <tr>
            <th>ID</th>
            <td>{{ student[0] }}</td>
        </tr>
        <tr>
            <th>Name</th>
            <td>{{ student[1] }}</td>
        </tr>
        <tr>
            <th>Roll No</th>
            <td>{{ student[2] }}</td>
        </tr>
        <tr>
            <th>Department</th>
            <td>{{ student[3] }}</td>
        </tr>
    </table>

    <br>

    <form method="POST" action="/delete/{{ student[0] }}" align="center">
        <button type="submit">Delete Student</button>
    </form>

    <br>

    <div align="center">
        <a href="/deletelist">
            <button type="button">Cancel</button>
        </a>
    </div>

</div>

</body>
</html>
