<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
</head>
<body>

<h1>All Students</h1>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Roll</th>
        <th>Gender</th>
    </tr>

    {% for s in students %}
    <tr>
        <td>{{ s[0] }}</td>
        <td>{{ s[1] }}</td>
        <td>{{ s[2] }}</td>
        <td>{{ s[3] }}</td>
    </tr>
    {% endfor %}

</table>

<br>
<a href="/">Add Student</a>

</body>
</html>
